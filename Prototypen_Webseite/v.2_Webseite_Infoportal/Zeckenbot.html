<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geführter Assistent</title>
    <link rel="stylesheet" href="style zecke.css" />
  </head>
  <body>
    <main class="chat">
      <header class="chat__header">
        <h1>Assistent</h1>
        <div class="chat__controls">
          <button id="btn-back" type="button">Zurück</button>
          <button id="btn-restart" type="button">Neustart</button>
        </div>
      </header>

      <!-- Verlauf der Nachrichten -->
      <section id="chat-log" class="chat__log" aria-live="polite"></section>

      <!-- Antwortmöglichkeiten -->
      <section id="chat-options" class="chat__options"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
